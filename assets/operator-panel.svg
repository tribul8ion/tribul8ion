<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="288" viewBox="0 0 1120 288" role="img" aria-label="Vlad, systems administrator building useful automation and software"><title>Vlad, systems administrator building useful automation and software</title><rect x="0" y="0" width="1120" height="288" fill="#101013"/><rect x="0.5" y="0.5" width="1119" height="287" fill="none" stroke="#524044" stroke-width="1"/><rect x="34" y="0" width="86" height="3" fill="#D28466"/><path d="M34 56H1086" stroke="#30292D" stroke-width="1" fill="none" opacity="1"/><text x="34" y="36" font-family="Consolas,'DejaVu Sans Mono',monospace" font-size="15" font-weight="700" fill="#D28466" letter-spacing="0.45">TRBL8 / 00 THE OPERATOR</text><text x="1086" y="37" font-family="Consolas,'DejaVu Sans Mono',monospace" font-size="13" font-weight="400" fill="#AB9A98" text-anchor="end">AUTHOR MARK / EDITORIAL</text><path d="M0.0,280.0 Q18.0,271.4 48.2,280.0 Q69.8,282.2 91.4,274.2" stroke="#524044" stroke-width="1.45" fill="none" opacity="0.72"/><path d="M31.7,277.1 Q23.0,265.6 32.4,255.5 Q30.2,267.8 38.2,277.1" stroke="#524044" stroke-width="1.35" fill="none" opacity="0.72"/><path d="M60.5,280.7 Q73.4,293.7 71.3,300.2 Q71.3,287.9 64.8,280.0" stroke="#524044" stroke-width="1.25" fill="none" opacity="0.72"/><path d="M1120.0,280.0 Q1102.0,271.4 1071.8,280.0 Q1050.2,282.2 1028.6,274.2" stroke="#524044" stroke-width="1.45" fill="none" opacity="0.72"/><path d="M1088.3,277.1 Q1097.0,265.6 1087.6,255.5 Q1089.8,267.8 1081.8,277.1" stroke="#524044" stroke-width="1.35" fill="none" opacity="0.72"/><path d="M1059.5,280.7 Q1046.6,293.7 1048.7,300.2 Q1048.7,287.9 1055.2,280.0" stroke="#524044" stroke-width="1.25" fill="none" opacity="0.72"/><path d="M1097 259 L1097.88 266.24 L1102.0 267 L1097.88 267.76 L1097 275 L1096.12 267.76 L1092.0 267 L1096.12 266.24 Z" fill="#A56661"/><text x="41" y="111" font-family="Georgia,'DejaVu Serif',serif" font-size="41" font-weight="500" fill="#F1E9DE">Systems by trade.</text><text x="41" y="161" font-family="Georgia,'DejaVu Serif',serif" font-size="41" font-weight="500" fill="#F1E9DE">Builder by instinct.</text><text x="41" y="206" font-family="Consolas,'DejaVu Sans Mono',monospace" font-size="15" font-weight="700" fill="#D28466">WINDOWS / LINUX / AUTOMATION</text><path d="M538 71V260" stroke="#524044" stroke-width="1" fill="none" opacity="1"/><path d="M538 139 L539.98 155.29 L549.25 157 L539.98 158.71 L538 175 L536.02 158.71 L526.75 157 L536.02 155.29 Z" fill="#D28466"/><text x="579" y="119" font-family="Arial,'Liberation Sans',sans-serif" font-size="21" font-weight="400" fill="#D8CCC2">I’m Vlad — a systems administrator who</text><text x="579" y="148" font-family="Arial,'Liberation Sans',sans-serif" font-size="21" font-weight="400" fill="#D8CCC2">builds software to make everyday IT work</text><text x="579" y="177" font-family="Arial,'Liberation Sans',sans-serif" font-size="21" font-weight="400" fill="#D8CCC2">more reliable, repeatable, and useful.</text><path d="M579 207H1076" stroke="#30292D" stroke-width="1" fill="none" opacity="1"/><text x="579" y="238" font-family="Consolas,'DejaVu Sans Mono',monospace" font-size="15" font-weight="600" fill="#BDAEAA">POWERSHELL • PYTHON • FLUTTER</text><text x="579" y="264" font-family="Consolas,'DejaVu Sans Mono',monospace" font-size="14" font-weight="400" fill="#AB9A98">INFRASTRUCTURE / SELF-HOSTING</text></svg>