,'Liberation Sans',sans-serif" font-size="21" font-weight="400" fill="#D8CCC2">I’m Vlad — a systems administrator who</text><text x="579" y="148" font-family="Arial,'Liberation Sans',sans-serif" font-size="21" font-weight="400" fill="#D8CCC2">builds software to make everyday IT work</text><text x="579" y="177" font-family="Arial,'Liberation Sans',sans-serif" font-size="21" font-weight="400" fill="#D8CCC2">more reliable, repeatable, and useful.</text><path d="M579 207H1076" stroke="#30292D" stroke-width="1" fill="none" opacity="1"/><text x="579" y="238" font-family="Consolas,'DejaVu Sans Mono',monospace" font-size="15" font-weight="600" fill="#BDAEAA">POWERSHELL • PYTHON • FLUTTER</text><text x="579" y="264" font-family="Consolas,'DejaVu Sans Mono',monospace" font-size="14" font-weight="400" fill="#AB9A98">INFRASTRUCTURE / SELF-HOSTING</text></svg>