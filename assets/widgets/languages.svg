<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 381" width="1120" height="381" role="img" aria-label="Language breakdown across public non-fork repositories"><title>Language breakdown across public non-fork repositories</title><rect x="0" y="0" width="1120" height="381" fill="#100F12"/><rect x="0.5" y="0.5" width="1119" height="380" fill="none" stroke="#42383E" stroke-width="1"/><rect x="36" y="0" width="84" height="3" fill="#C17176"/><text x="36" y="35" font-family="Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="15" font-weight="700" fill="#C17176" letter-spacing="0.8">TRBL8 / 03 CODE FOOTPRINT</text><text x="1084" y="35" font-family="Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="14" font-weight="400" fill="#8F8588" text-anchor="end">AWAITING FIRST SYNC</text><text x="36" y="83" font-family="Arial,'Liberation Sans',sans-serif" font-size="32" font-weight="700" fill="#F0E9DE">Languages in public repositories.</text><text x="36" y="112" font-family="Arial,'Liberation Sans',sans-serif" font-size="17" font-weight="400" fill="#AAA0A0">Language share is calculated from GitHub-reported code bytes, not developer proficiency.</text><path d="M36 133H1084" stroke="#302B30" stroke-width="1" fill="none"/><path d="M36 338H1084" stroke="#302B30" stroke-width="1" fill="none"/><text x="36" y="364" font-family="Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="14" font-weight="400" fill="#8F8588">SCOPE / PUBLIC NON-FORK OWNED REPOSITORIES • UP TO 30 RECENT REPOS</text><text x="36" y="171" font-family="Arial,'Liberation Sans',sans-serif" font-size="23" font-weight="600" fill="#F0E9DE">No language breakdown yet</text><text x="36" y="199" font-family="Arial,'Liberation Sans',sans-serif" font-size="17" font-weight="400" fill="#AAA0A0">Public repositories will be indexed during the first sync.</text><rect x="252" y="215" width="673" height="10" fill="#302B30"/><rect x="252" y="245" width="514" height="10" fill="#302B30"/><rect x="252" y="275" width="391" height="10" fill="#302B30"/><rect x="252" y="305" width="290" height="10" fill="#302B30"/></svg>